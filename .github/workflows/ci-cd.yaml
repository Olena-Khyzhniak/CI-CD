
# CI/CD pipeline: builds Docker image, pushes to ECR, deploys to MicroK8s on EC2
# generated by Bob AI

name: CI/CD Pipeline

on:
  push:
    tags:
      - 'v*' # start with tag v, e.g., v1.0.0, v2.0.0

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ci-cd/demo-app
          IMAGE_TAG: ${{ github.ref_name }}     # v1.0.0, v2.0.0 etc

        run: |
          docker build \
            --build-arg VITE_TMDB_KEY=${{ secrets.VITE_TMDB_KEY }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest


  deploy:
    name: Deploy to MicroK8s
    runs-on: ubuntu-latest
    needs: build-and-push       # wait for build-and-push job to complete

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Deploy to MicroK8s via SSH
        uses: appleboy/ssh-action@v0.1.10

        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ci-cd/demo-app
          IMAGE_TAG: ${{ github.ref_name }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,IMAGE_TAG,ECR_REPOSITORY    # send these env vars to the remote host (SSH script/server)

          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            microk8s kubectl apply -f k8s/demo-app/namespace.yaml
            microk8s kubectl apply -f k8s/demo-app/configmap.yaml
            microk8s kubectl apply -f k8s/demo-app/secret.yaml
            microk8s kubectl apply -f k8s/demo-app/deployment.yaml
            microk8s kubectl apply -f k8s/demo-app/service.yaml
            microk8s kubectl apply -f k8s/demo-app/hpa.yaml

            microk8s kubectl set image deployment/demo-app \
              demo-app-container=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
              -n demo-app
            microk8s helm3 upgrade prometheus \
            prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --values monitoring/prometheus-values.yaml \
            --install               # GitHub Actions workflow
            microk8s kubectl rollout status deployment/demo-app -n demo-app   # wait for the rollout to complete

