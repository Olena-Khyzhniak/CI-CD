# calico-felixconfig.yaml
# FelixConfiguration patch to fix rp_filter on VXLAN interfaces in AWS.
#
# Problem: Calico Felix sets rp_filter=1 (strict) on all interfaces including
# vxlan.calico. On AWS with asymmetric routing (VXLAN decapped packets arrive
# on vxlan.calico but the reverse-path lookup may choose ens5), strict rp_filter
# drops legitimate cross-node pod traffic silently.
#
# Fix: AWSSrcDstCheck=Disable tells Felix to set rp_filter=0 on the VXLAN
# interface, which is required for correct VXLAN operation on AWS EC2.
# This is the officially documented Calico setting for AWS deployments.
#
# Reference: https://docs.tigera.io/calico/latest/reference/resources/felixconfig
#
# Apply: kubectl apply -f k8s/cluster/calico-felixconfig.yaml
---
apiVersion: crd.projectcalico.org/v1
kind: FelixConfiguration
metadata:
  name: default
spec:
  # Disable AWS src/dst check management — lets Felix set rp_filter=0 on
  # VXLAN interfaces, which is required for cross-node pod communication.
  AWSSrcDstCheck: "Disable"
  # Keep existing settings from cluster:
  bpfConnectTimeLoadBalancing: TCP
  bpfHostNetworkedNATWithoutCTLB: Enabled
  floatingIPs: Disabled
  logSeverityScreen: Info
  reportingInterval: 0s
