# Exposes the demo-app pods to external traffic via a LoadBalancer service on port 80. 
# This service will route incoming requests to the demo-app pods based on the label selector.

apiVersion: v1
kind: Service
metadata:
  name: demo-app-service
  namespace: demo-app
  labels:
    app: demo-app      # The service is associated with the demo-app deployment (finds pods with the same label)
spec:
  selector:
    app: demo-app
  ports:
    - name: http
      protocol: TCP
      port: 80          # The port on which the service is exposed (the port that clients will use to access the service)
      targetPort: 80    # containerPort in the deployment spec (the port on which the application is running inside the pod)
  type: LoadBalancer    # Exposes the service externally using a cloud provider's load balancer (public IP)    