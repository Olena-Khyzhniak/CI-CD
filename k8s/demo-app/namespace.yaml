# Isolates demo-app resources from other workloads in the cluster by creating a dedicated namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
  labels:
    name: demo-app   # k8s label to identify the namespace
    istio-injection: enabled  # Istio sidecar injection enabled (VXLAN rp_filter fix applied, failurePolicy=Ignore)