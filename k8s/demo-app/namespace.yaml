# Isolates demo-app resources from other workloads in the cluster by creating a dedicated namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
  labels:
    name: demo-app   # k8s label to identify the namespace
    # istio-injection: enabled  # Uncomment to re-enable Istio sidecar injection (disabled: cross-node VXLAN issue, see GitHub issue)