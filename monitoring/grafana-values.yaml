# Grafana configurations for ci-cd cluster

adminUser: admin
adminPassword: admin123

service:
  type: NodePort
  nodePort: 30000

persistence:
  enabled: true
  size: 1Gi  

datasource:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-operated:9090
        isDefault: true 