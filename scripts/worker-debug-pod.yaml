apiVersion: v1
kind: Pod
metadata:
  name: worker-debug
  namespace: kube-system
spec:
  nodeSelector:
    kubernetes.io/hostname: cicd-worker
  hostNetwork: true
  hostPID: true
  tolerations:
    - operator: Exists
  restartPolicy: Never
  containers:
    - name: debug
      image: nicolaka/netshoot
      command: ["sleep", "600"]
      securityContext:
        privileged: true
